[package]
name = "notahub"
version = "0.1.0"
edition = "2021"
description = "A keyboard-driven TUI for managing projects and ideas in plain markdown"
authors = ["notahub"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
